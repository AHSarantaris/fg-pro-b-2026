<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortest Path - Unit Tests</title>
    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 2rem auto;
            max-width: 720px;
            padding: 0 1rem;
            background: #f5f6f8;
            color: #1a2332;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
        }

        .note {
            color: #56606e;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        #test-summary {
            font-weight: bold;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            background: #e3e7ec;
            margin-bottom: 1rem;
        }

        #test-summary.pass {
            background: #d5efd9;
            color: #1d6b2f;
        }

        #test-summary.fail {
            background: #f7d6d5;
            color: #9c1c1c;
        }

        #test-results {
            list-style: none;
            padding: 0;
        }

        #test-results li {
            padding: 0.35rem 0.75rem;
            margin-bottom: 4px;
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #test-results li.pass {
            background: #e7f5e9;
        }

        #test-results li.fail {
            background: #fbe9e9;
        }

        #test-results li.group {
            font-weight: bold;
            font-family: system-ui, Arial, sans-serif;
            background: transparent;
            color: #1a2332;
            padding: 0.25rem 0.75rem 0.25rem 0;
            margin-top: 0.75rem;
            border-bottom: 1px solid #c6ccd6;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <h1>Unit tests</h1>
    <p class="note">Results are shown here and in the browser console (F12 &rarr; Console).</p>
    <p id="test-summary">Running...</p>
    <ul id="test-results"></ul>

    <!-- Code under test -->
    <script src="Queue.js"></script>
    <script src="BinaryMatrixGraph.js"></script>
    <script src="shortestPathBFS.js"></script>

    <!-- Test framework and test files -->
    <script src="testUtils.js"></script>
    <script src="Queue.test.js"></script>
    <script src="BinaryMatrixGraph.test.js"></script>
    <script src="runTests.js"></script>
</body>
</html>
